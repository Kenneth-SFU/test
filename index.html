<!DOCTYPE html>
<html>
    <style>
    /* 1. Register properties to calculate unitless window width */
    @property --_w {
      syntax: '<length>';
      inherits: true;
      initial-value: 100vw;
    }

    :root {
      /* Converts 100vw into a raw, unitless integer */
      --width: tan(atan2(var(--_w), 1px)); 
    }

    /* 2. Style your pure CSS debug badge */
    .debug-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 30px;
      border-radius: 4px;
      z-index: 99999;
    }

    /* 3. Inject the live pixel width and default DPR */
    .debug-badge::before {
      counter-reset: w var(--width);
      content: "Width: " counter(w) "px | DPR: 1";
    }

    /* 4. Update the DPR display dynamically via Media Queries */
    @media (min-resolution: 2dppx) {
      .debug-badge::before {
        content: "Width: " counter(w) "px | DPR: 2";
      }
    }

    @media (min-resolution: 3dppx) {
      .debug-badge::before {
        content: "Width: " counter(w) "px | DPR: 3";
      }
    }
    
    </style>
<body>

<h1>Image srcset test</h1>
<div class="debug-badge"></div>

<div style=" container-type: inline-size;    container-name: panel;    resize: horizontal; 
            /* width: 300px;     overflow: auto; */">
