<!DOCTYPE html>
<html>
    <style>
    /* Default for standard screens (DPR = 1) */
    .dpr-indicator::after {
      content: "1";
      font-weight: bold;
    }

    /* Target Retina/High-DPI screens (DPR = 2) */
    @media (min-resolution: 2dppx) {
      .dpr-indicator::after {
        content: "2";
      }
    }

    /* Target Ultra High-DPI screens (DPR = 3) */
    @media (min-resolution: 3dppx) {
      .dpr-indicator::after {
        content: "3";
      }
    }

    /* Target precise intermediate fractional DPRs if needed (e.g., 1.5) */
    @media (min-resolution: 1.5dppx) and (max-resolution: 1.99dppx) {
      .dpr-indicator::after {
        content: "1.5";
      }
    }
    
    </style>
<body>

<h1>Image srcset test</h1>
<div class="dpr-indicator">Your DPR is: </div>

<div style=" container-type: inline-size;    container-name: panel;    resize: horizontal; 
            /* width: 300px;     overflow: auto; */">
<img 
     src="images/2400.jpg" 
     style="width: 100%;"
     sizes="(max-width: 600px) 400px, 
            (max-width: 1200px) 800px, 
            1200px" 
     srcset="images/3840.webp 3840w,
            images/2400.webp 2400w,
            images/1600.webp 1600w,
            images/1200.webp 1200w,
            images/800.webp 800w,
            images/400.webp 400w" alt="Students walking down a flight of stairs">
</div>
